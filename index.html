<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiri Coffee and Food</title>
<!-- When self-hosting, this loads the Telegram WebApp SDK (blocked in the preview; the app falls back to demo mode) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F3ECE2;--card:#FBF7F1;--ink:#4A2913;--brand:#6B3A1F;--mid:#A87752;--mute:#7d6a5b;--line:#e6dccf;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1611;--card:#2a1f18;--ink:#f1e4d6;--brand:#c98d5c;--mid:#7a4f31;--mute:#b5a191;--line:#3d2f25;--on:#1d1611}}
:root[data-theme="dark"]{--bg:#1d1611;--card:#2a1f18;--ink:#f1e4d6;--brand:#c98d5c;--mid:#7a4f31;--mute:#b5a191;--line:#3d2f25;--on:#1d1611}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;background:var(--card);position:relative;overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:18px 20px 90px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--brand)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
.btn{width:100%;background:var(--brand);color:var(--on);border-radius:999px;padding:15px;font-weight:600}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;height:100%;padding:60px 28px 40px}
.logo{width:150px;height:150px;border-radius:50%;background:var(--brand);color:var(--on);display:grid;place-items:center;font:700 44px Georgia,serif}
.hdr{display:flex;justify-content:space-between;align-items:center}
.brand{font:700 22px Georgia,serif;color:var(--brand)}
.search{width:100%;margin:14px 0;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit}
.banner{background:var(--mid);color:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.banner h3{color:#fff;font-size:20px;margin:2px 0 10px}
.pill{background:#fff;color:var(--brand);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.cat{text-align:center;font-size:12px;color:var(--mute)}
.cat span{display:grid;place-items:center;height:60px;border-radius:16px;background:var(--bg);font-size:26px;margin-bottom:4px;border:2px solid transparent}
.cat.on span{border-color:var(--brand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--bg);border-radius:14px;overflow:hidden;text-align:left;width:100%}
.item .ph{height:84px;display:grid;place-items:center;font-size:42px}
.item .in{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.plus{background:var(--brand);color:var(--on);width:26px;height:26px;border-radius:50%;line-height:26px;text-align:center}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;font-size:11px;color:var(--mute);position:relative}
.tab b{display:block;font-size:20px;font-weight:400}
.tab.on{color:var(--brand);font-weight:700}
.badge{position:absolute;top:-2px;left:56%;background:var(--brand);color:var(--on);border-radius:9px;font-size:10px;padding:0 5px}
.hero{height:230px;background:var(--bg);display:grid;place-items:center;font-size:110px;position:relative}
.round{position:absolute;top:14px;width:38px;height:38px;border-radius:50%;background:var(--card);font-size:18px}
.opts{display:flex;gap:8px;margin:8px 0 16px}
.opt{flex:1;padding:9px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.opt.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.chk{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;color:var(--mute)}
.qty{display:flex;align-items:center;gap:12px}.qty button{width:34px;height:34px;border-radius:10px;background:var(--bg)}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card)}
.line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.toast{position:absolute;left:20px;right:20px;top:16px;background:var(--brand);color:var(--on);padding:12px;border-radius:12px;text-align:center;z-index:9}
.ph img,.hero img{width:100%;height:100%;object-fit:cover}.item .ph{height:110px;overflow:hidden}.hero{overflow:hidden}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const MENU = [
 {id:"americano",name:"Kiri Americano",cat:"Coffee",price:1,img:"espresso",e:"☕",drink:1,d:"A bold, concentrated single shot with a rich crema."},
 {id:"cappuccino",name:"Cappuccino",cat:"Coffee",price:4.5,img:"cappuccino",e:"☕",drink:1,pop:1,d:"Espresso with steamed milk and a thick layer of foam."},
 {id:"latte",name:"Caffè Latte",cat:"Coffee",price:4.75,img:"latte",e:"☕",drink:1,d:"Smooth espresso with velvety steamed milk and latte art."},
 {id:"flat-white",name:"Flat White",cat:"Coffee",price:4.5,img:"flat-white",e:"☕",drink:1,d:"Double ristretto topped with silky microfoam."},
 {id:"cold-brew",name:"Cold Brew",cat:"Coffee",price:5,img:"cold-brew",e:"🧊",drink:1,d:"Slow-steeped for 18 hours, smooth and naturally sweet."},
 {id:"mocha",name:"Mocha",cat:"Coffee",price:5.25,img:"mocha",e:"☕",drink:1,d:"Espresso, dark chocolate and steamed milk with whipped cream."},
 {id:"matcha-latte",name:"Matcha Latte",cat:"Matcha",price:5.5,img:"matcha-latte",e:"🍵",drink:1,pop:1,d:"Ceremonial-grade matcha whisked with creamy milk."},
 {id:"iced-matcha-latte",name:"Iced Matcha Latte",cat:"Matcha",price:5.75,img:"iced-matcha-latte",e:"🍵",drink:1,d:"Vibrant matcha layered over cold milk and ice."},
 {id:"strawberry-matcha",name:"Strawberry Matcha",cat:"Matcha",price:6.25,img:"strawberry-matcha",e:"🍓",drink:1,pop:1,d:"Fresh strawberry puree, creamy milk and whisked matcha."},
 {id:"matcha-espresso",name:"Matcha Espresso Fusion",cat:"Matcha",price:6,img:"matcha-espresso",e:"🍵",drink:1,d:"Bold espresso poured over creamy matcha and milk."},
 {id:"chai-latte",name:"Chai Latte",cat:"Tea & More",price:5,img:"chai-latte",e:"🫖",drink:1,d:"Spiced black tea blend with frothed milk and cinnamon."},
 {id:"avocado-toast",name:"Avocado Toast",cat:"Food",price:8.5,img:"avocado-toast",e:"🥑",d:"Sourdough, smashed avocado, chili flakes and microgreens."},
 {id:"breakfast-sandwich",name:"Breakfast Sandwich",cat:"Food",price:7.5,img:"breakfast-sandwich",e:"🥪",pop:1,d:"Egg, cheddar and bacon on a toasted brioche bun."}];
const SIZES = [["Small",0],["Medium",.5],["Large",1]];
const ADDONS = [["Extra Shot",.75],["Oat Milk",.5],["Vanilla Syrup",.5]];
const CATS = [["Coffee","☕"],["Matcha","🍵"],["Tea & More","🫖"],["Food","🍴"]];
const S = {view:"splash", tab:"home", cat:null, q:"", cart:[], d:null};
const $ = document.getElementById("app");
const money = n => "$" + n.toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const find = id => MENU.find(m => m.id === id);
const linePrice = l => { const m = find(l.id); return (m.price + SIZES[l.size][1] + l.addons.reduce((a,i)=>a+ADDONS[i][1],0)) * l.qty; };
const detailPrice = () => linePrice(S.d);
const cartCount = () => S.cart.reduce((a,l)=>a+l.qty,0);
const cartTotal = () => S.cart.reduce((a,l)=>a+linePrice(l),0);

function go(v, t) { S.view = v; if (t) S.tab = t; render(); }
function open(id) { S.d = {id, size:0, addons:[], qty:1}; go("detail"); }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; $.appendChild(t); setTimeout(()=>t.remove(), 2200); }
function quickAdd(id) { S.cart.push({id, size:0, addons:[], qty:1}); render(); toast(find(id).name + " added"); }

const pic = m => `<img src="/menu/${m.img}.png" alt="${esc(m.name)}" onerror="this.replaceWith(document.createTextNode('${m.e}'))">`;
function tile(m) {
  return `<div class="item"><button class="ph" style="width:100%" data-open="${m.id}" aria-label="${esc(m.name)}">${pic(m)}</button>
  <div class="in"><div><b>${esc(m.name)}</b><br>${money(m.price)}</div><button class="plus" data-add="${m.id}" aria-label="Add ${esc(m.name)}">+</button></div></div>`;
}
function tabs() {
  const t = [["home","🏠","Home"],["menu","📖","Menu"],["orders","🛍️","Orders"],["profile","👤","Profile"]];
  return `<nav class="tabs">${t.map(([k,i,l]) => `<button class="tab ${S.tab===k?"on":""}" data-tab="${k}"><b>${i}</b>${l}${k==="orders"&&cartCount()?`<span class="badge">${cartCount()}</span>`:""}</button>`).join("")}</nav>`;
}
function home() {
  const pop = !S.cat && !S.q; const items = MENU.filter(m => (pop ? m.pop : (!S.cat || m.cat === S.cat)) && m.name.toLowerCase().includes(S.q.toLowerCase()));
  return `<div class="scr"><div class="hdr"><span class="brand">Kiri <small style="font:12px sans-serif">coffee and food</small></span><span>🔔</span></div>
  <h2 style="margin-top:16px">Good Morning ☀️</h2><p style="color:var(--mute)">Enjoy your favorite coffee<br>and fresh food today.</p>
  <input class="search" id="q" placeholder="Search menu…" value="${esc(S.q)}" aria-label="Search menu">
  <div class="banner"><div><small>Start Your Day</small><h3>With Great Coffee</h3><button class="pill" data-tab="menu">Explore Menu →</button></div><span style="font-size:58px">☕</span></div>
  <div class="row"><b>Our Favorites</b><button data-tab="menu" style="font-size:12px">See All →</button></div>
  <div class="cats">${CATS.map(([c,e]) => `<button class="cat ${S.cat===c?"on":""}" data-cat="${esc(c)}"><span>${e}</span>${esc(c)}</button>`).join("")}</div>
  <b>${pop ? "Popular Items" : esc(S.cat || "Results")}</b><div class="grid" style="margin-top:10px">${items.map(tile).join("") || "<p style='color:var(--mute)'>Nothing matches. Try another search.</p>"}</div></div>${tabs()}`;
}
function menuView() { return `<div class="scr"><h2>Menu</h2><div class="grid" style="margin-top:14px">${MENU.map(tile).join("")}</div></div>${tabs()}`; }
function ordersView() {
  const rows = S.cart.map((l,i) => { const m = find(l.id); return `<div class="line"><span>${l.qty}× ${esc(m.name)}${m.drink?` (${SIZES[l.size][0]})`:""}</span><span>${money(linePrice(l))} <button data-rm="${i}" aria-label="Remove">✕</button></span></div>`; }).join("");
  return `<div class="scr"><h2>Your order</h2>${rows || "<p style='color:var(--mute);margin-top:12px'>Your cart is empty. Pick something from the menu.</p>"}
  ${S.cart.length ? `<div class="line"><b>Total</b><b>${money(cartTotal())}</b></div><button class="btn" style="margin-top:16px" id="checkout">Place order</button>` : ""}</div>${tabs()}`;
}
function profileView() {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  return `<div class="scr"><h2>Profile</h2><p style="margin-top:12px">${u ? "Hi, " + esc(u.first_name) + "!" : "Open this app inside Telegram to see your profile."}</p></div>${tabs()}`;
}
function detail() {
  const m = find(S.d.id), d = S.d;
  return `<div class="hero"><button class="round" style="left:16px" data-tab="${S.tab}" aria-label="Back">←</button><button class="round" style="right:16px" aria-label="Favorite">♡</button>${pic(m)}</div>
  <div class="scr" style="padding-top:16px"><div class="row"><h2>${esc(m.name)}</h2><h3>${money(m.price)}</h3></div><p style="color:var(--mute)">${esc(m.d)}</p>
  ${m.drink ? `<p style="margin-top:16px"><b>Size</b></p><div class="opts">${SIZES.map(([n],i)=>`<button class="opt ${d.size===i?"on":""}" data-size="${i}">${n}</button>`).join("")}</div>
  <p><b>Add-ons</b></p>${ADDONS.map(([n,p],i)=>`<label class="chk"><span><input type="checkbox" data-addon="${i}" ${d.addons.includes(i)?"checked":""}> ${n}</span><span>+${money(p)}</span></label>`).join("")}` : ""}
  <div class="row" style="margin-top:20px"><b>Quantity</b><div class="qty"><button data-q="-1" aria-label="Less">−</button><b>${d.qty}</b><button data-q="1" aria-label="More">+</button></div></div></div>
  <div class="foot"><button class="btn" id="addcart">Add to Cart • ${money(detailPrice())}</button></div>`;
}
function render() {
  const keep = document.activeElement && document.activeElement.id === "q";
  if (S.view === "splash") $.innerHTML = `<div class="splash"><img src="/kiri-logo.png" alt="Kiri Coffee and Food" style="width:180px" onerror="this.outerHTML='<div class=logo>Kiri</div>'"><div><h2>Good Coffee<br>Better Moments</h2><p style="color:var(--mute);margin-top:10px">Great coffee, fresh food,<br>&amp; a cozy place for you.</p></div><button class="btn" data-tab="home">Get Started →</button></div>`;
  else if (S.view === "detail") $.innerHTML = detail();
  else $.innerHTML = {home, menu:menuView, orders:ordersView, profile:profileView}[S.tab]();
  if (keep) { const q = document.getElementById("q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
async function checkout() {
  const order = S.cart.map(l => ({id:l.id, size:l.size, addons:l.addons, qty:l.qty}));
  try {
    const r = await fetch("/api/orders", {method:"POST", headers:{"Content-Type":"application/json", "Authorization":"tma " + (tg ? tg.initData : "")}, body:JSON.stringify({items:order})});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(); toast("Order #" + j.id + " placed"); S.cart = [];
  } catch (e) { toast("Demo mode: connect the backend to place orders"); }
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  render();
}
$.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
  if (d.tab) { S.cat = null; go("main", d.tab); }
  else if (d.cat) { S.cat = S.cat === d.cat ? null : d.cat; render(); }
  else if (d.open) open(d.open);
  else if (d.add) quickAdd(d.add);
  else if (d.size) { S.d.size = +d.size; render(); }
  else if (d.q) { S.d.qty = Math.max(1, S.d.qty + +d.q); render(); }
  else if (d.rm) { S.cart.splice(+d.rm, 1); render(); }
  else if (t.id === "addcart") { S.cart.push(S.d); toast(find(S.d.id).name + " added"); go("main"); }
  else if (t.id === "checkout") checkout();
});
$.addEventListener("change", e => { const a = e.target.dataset.addon; if (a !== undefined) { const i = +a, s = S.d.addons; s.includes(i) ? s.splice(s.indexOf(i),1) : s.push(i); render(); } });
$.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
render();
</script>
</body>
</html>
