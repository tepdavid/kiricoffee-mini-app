<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiri Coffee and Food</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--sat:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));--bg:#F3ECE2;--card:#FBF7F1;--ink:#4A2913;--brand:#6B3A1F;--mid:#A87752;--mute:#7d6a5b;--line:#e6dccf;--on:#fff;
box-sizing:border-box;padding-top:var(--sat)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1611;--card:#2a1f18;--ink:#f1e4d6;--brand:#c98d5c;--mid:#7a4f31;--mute:#b5a191;--line:#3d2f25;--on:#1d1611}}
:root[data-theme="dark"]{--bg:#1d1611;--card:#2a1f18;--ink:#f1e4d6;--brand:#c98d5c;--mid:#7a4f31;--mute:#b5a191;--line:#3d2f25;--on:#1d1611}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100%;background:var(--card);position:relative;overflow:hidden;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
h2{font:700 22px Georgia,serif;color:var(--brand);margin:6px 0 12px}
.brand{font:700 26px Georgia,serif;color:var(--brand)}.hd small{margin-left:8px;color:var(--mute)}
.mute{color:var(--mute)}
.in{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.chip.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--bg);border-radius:16px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ph{height:110px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:44px;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.card b{font-size:14px;margin-top:4px}.card span{color:var(--mute);font-size:13px}
.btn{width:100%;background:var(--brand);color:var(--on);border-radius:999px;padding:14px;font-weight:600;margin-top:10px}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.sm{padding:6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.sm.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.box{background:var(--bg);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.badge{font-size:11px;color:#fff;padding:3px 9px;border-radius:999px}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;font-size:10.5px;color:var(--mute);position:relative}.tab b{display:block;font-size:19px;font-weight:400}.tab.on{color:var(--brand);font-weight:700}
.dot{position:absolute;top:-2px;left:56%;background:var(--brand);color:var(--on);border-radius:9px;font-size:10px;padding:0 5px}
#sheet{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:20}
#sheet[hidden],#toast[hidden]{display:none}
.sh{width:100%;max-height:88%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh .ph{height:170px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;margin:6px 0;background:var(--bg)}
.bub.me{margin-left:auto;background:var(--brand);color:var(--on)}
.bub small{display:block;opacity:.7;font-size:10px}
#toast{position:absolute;left:16px;right:16px;top:calc(12px + var(--sat));background:var(--brand);color:var(--on);padding:11px;border-radius:12px;text-align:center;z-index:40}
.qr{width:180px;height:180px;object-fit:contain;display:block;margin:8px auto;background:#fff;border-radius:12px}
.out{display:grid;place-items:center;height:100%;text-align:center;padding:30px}
</style>
</head>
<body>
<div id="app"><main id="v"></main><nav id="nav"></nav><div id="sheet" hidden></div><div id="toast" hidden></div></div>
<script>
const PREVIEW = false; // true only for the design preview in chat. Leave false on your real site.
const TELEGRAM_LINK = ""; // your shop's link, like https://t.me/YOUR_BOT/APP_NAME
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { if (tg.isFullscreen && tg.exitFullscreen) tg.exitFullscreen(); } catch {} }
const live = () => tg && tg.initData;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => "$" + Number(n).toFixed(2);
const code = o => o.id.split("-")[0].toUpperCase();
const STAT = { awaiting_payment: ["Awaiting payment", "#b7791f"], paid_claimed: ["Checking payment", "#2b6cb0"], confirmed: ["Confirmed", "#2f855a"], preparing: ["Preparing", "#2f855a"], ready: ["Ready for pickup", "#2f855a"], on_the_way: ["On the way", "#2f855a"], done: ["Completed", "#718096"], cancelled: ["Cancelled", "#c53030"] };
let M = { cats: [], items: [], sizes: [], sugars: [], fee: 0, bank: {}, admin: false };
let S = { tab: "menu", cat: "", q: "", cart: [], mode: "pickup", form: { phone: "", address: "", note: "" }, prof: {}, orders: [], thread: [], with: null, wname: "", aTab: "orders", aOrders: [], threads: [], pay: null, item: null };

// ---- server calls (a tiny in-memory stand-in is used for the chat preview) ----
async function api(a, b) {
  if (!live()) return mock(a, b || {});
  const r = await fetch("/api/shop?action=" + a, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "tma " + tg.initData }, body: JSON.stringify(b || {}) });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || r.status); }
  return r.json();
}
const D = { orders: [], msgs: [] };
async function mock(a, b) {
  const it = (id, name, cat, price, e, drink) => ({ id, name, cat, price, img: id, e, drink, d: "Freshly made for you." });
  if (a === "menu") return { cats: ["Coffee", "Matcha", "Food"], items: [it("latte", "Caffè Latte", "Coffee", 4.75, "☕", 1), it("cappuccino", "Cappuccino", "Coffee", 4.5, "☕", 1), it("matcha-latte", "Matcha Latte", "Matcha", 5.5, "🍵", 1), it("avocado-toast", "Avocado Toast", "Food", 8.5, "🥑", 0)], sizes: [["Small", 0], ["Medium", .5], ["Large", 1]], sugars: ["0%", "25%", "50%", "75%", "100%"], fee: 1.5, bank: { name: "ABA Bank", account: "000 123 456", holder: "Kiri Coffee" }, admin: false };
  if (a === "profile") return { profile: { name: "Sample Customer" } };
  if (a === "profile_set") return { ok: 1 };
  if (a === "order_create") { const m = (await mock("menu")).items; let t = 0; b.items.forEach(i => { const x = m.find(y => y.id === i.id); t += (x.price + (x.drink ? [0, .5, 1][i.size] : 0)) * i.qty; }); const o = { id: Date.now().toString(36) + "-1", items: b.items.map(i => ({ ...i, name: m.find(y => y.id === i.id).name, size: m.find(y => y.id === i.id).drink ? ["Small", "Medium", "Large"][i.size] : null, sugar: m.find(y => y.id === i.id).drink ? ["0%", "25%", "50%", "75%", "100%"][i.sugar] : null })), total: t + (b.mode === "delivery" ? 1.5 : 0), mode: b.mode, address: b.address, status: "awaiting_payment", at: Date.now() }; D.orders.unshift(o); return { order: o }; }
  if (a === "orders") return { orders: D.orders };
  if (a === "order_pay") { D.orders.forEach(o => { if (o.id === b.id) o.status = "paid_claimed"; }); return { ok: 1 }; }
  if (a === "msg_send") { D.msgs.push({ from: "me", text: b.text, at: Date.now() }, { from: "admin", text: "Thanks! We'll get back to you soon. ☕", at: Date.now() + 1 }); return { ok: 1 }; }
  if (a === "msg_thread") return { messages: D.msgs };
  return {};
}

// ---- helpers ----
const find = id => M.items.find(x => x.id === id);
const linePrice = l => { const m = find(l.id); return (m.price + (m.drink ? M.sizes[l.size][1] : 0)) * l.qty; };
const sub = () => S.cart.reduce((a, l) => a + linePrice(l), 0);
const fee = () => S.mode === "delivery" ? M.fee : 0;
const pic = m => `<img src="/menu/${m.img}.png" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${m.e}'))">`;
let tt; const toast = m => { const e = $("toast"); e.textContent = m; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 2600); };
const linesText = o => o.items.map(i => `${i.qty}× ${esc(i.name)}${i.size ? ` (${esc(i.size)}, sugar ${esc(i.sugar)})` : ""}`).join(", ");
const go = t => { S.tab = t; render(); if (t === "orders") loadOrders(); if (t === "chat") loadThread(); if (t === "admin") loadAdmin(); };

// ---- screens ----
function menuView() {
  const q = S.q.toLowerCase(), list = M.items.filter(m => (!S.cat || m.cat === S.cat) && m.name.toLowerCase().includes(q));
  return `<div class="hd"><span class="brand">Kiri</span><small>coffee and food</small></div>
  <input id="q" class="in" placeholder="Search menu…" value="${esc(S.q)}" aria-label="Search menu">
  <div class="chips">${["", ...M.cats].map(c => `<button class="chip ${S.cat === c ? "on" : ""}" data-a="cat" data-v="${esc(c)}">${esc(c || "All")}</button>`).join("")}</div>
  <div class="grid">${list.map(m => `<button class="card" data-a="open" data-v="${m.id}"><div class="ph">${pic(m)}</div><b>${esc(m.name)}</b><span>${money(m.price)}</span></button>`).join("") || '<p class="mute">Nothing found.</p>'}</div>`;
}
function cartView() {
  if (!S.cart.length) return `<h2>Your cart</h2><p class="mute">Your cart is empty. Pick something from the menu.</p><button class="btn" data-a="tab" data-v="menu">Browse menu</button>`;
  const f = S.form;
  return `<h2>Your cart</h2>${S.cart.map((l, i) => { const m = find(l.id); return `<div class="box"><div class="row"><b>${esc(m.name)}</b><b>${money(linePrice(l))}</b></div>
    ${m.drink ? `<div class="mute">${M.sizes[l.size][0]} · Sugar ${M.sugars[l.sugar]}</div>` : ""}
    <div class="row"><span><button class="sm" data-a="qty" data-v="${i}:-1" aria-label="Less">−</button> ${l.qty} <button class="sm" data-a="qty" data-v="${i}:1" aria-label="More">+</button></span><button class="sm" data-a="rm" data-v="${i}">Remove</button></div></div>`; }).join("")}
  <h2 style="font-size:18px">Delivery</h2>
  <div class="opts"><button class="sm ${S.mode === "pickup" ? "on" : ""}" data-a="mode" data-v="pickup">Pick up</button><button class="sm ${S.mode === "delivery" ? "on" : ""}" data-a="mode" data-v="delivery">Delivery (+${money(M.fee)})</button></div>
  <input class="in" data-f="phone" placeholder="Phone number" inputmode="tel" value="${esc(f.phone)}" aria-label="Phone number">
  ${S.mode === "delivery" ? `<textarea class="in" data-f="address" rows="2" placeholder="Delivery address" aria-label="Delivery address">${esc(f.address)}</textarea>` : ""}
  <input class="in" data-f="note" placeholder="Note for the shop (optional)" value="${esc(f.note)}" aria-label="Note">
  <div class="box"><div class="row"><span>Subtotal</span><span>${money(sub())}</span></div>${S.mode === "delivery" ? `<div class="row"><span>Delivery</span><span>${money(fee())}</span></div>` : ""}<div class="row"><b>Total</b><b>${money(sub() + fee())}</b></div></div>
  <button class="btn" data-a="place">Place order and pay by bank</button>`;
}
function payView() {
  const o = S.pay, b = M.bank; if (!o) return `<h2>Bank payment</h2><p class="mute">No order to pay right now.</p>`;
  return `<h2>Bank payment</h2><div class="box"><p>Please transfer <b>${money(o.total)}</b> to:</p>
  <p style="margin:8px 0">${esc(b.name || "Bank")}<br><b>${esc(b.account || "Bank account not set yet")}</b><br>${esc(b.holder || "")}</p>
  <button class="sm" data-a="copy" data-v="${esc(b.account || "")}">Copy account number</button>
  <p style="margin-top:10px">Reference: <b>#${code(o)}</b></p><img class="qr" src="/bank-qr.png" alt="Bank QR code" onerror="this.remove()"></div>
  <p class="mute">After you pay, tap the button below. The shop checks the payment and confirms your order.</p>
  <button class="btn" data-a="paid">I've paid</button><button class="btn ghost" data-a="tab" data-v="orders">Pay later</button>`;
}
function orderCard(o, admin) {
  const [t, c] = STAT[o.status] || [o.status, "#718096"];
  const btns = admin ? `<div class="opts">${[["confirmed", "Confirm"], ["preparing", "Preparing"], [o.mode === "delivery" ? "on_the_way" : "ready", o.mode === "delivery" ? "On the way" : "Ready"], ["done", "Done"], ["cancelled", "Cancel"]].map(([s, l]) => `<button class="sm ${o.status === s ? "on" : ""}" data-a="st" data-v="${o.id}|${s}">${l}</button>`).join("")}<button class="sm" data-a="chatwith" data-v="${o.uid}|${esc(o.name)}">Message</button></div>` : "";
  return `<div class="box"><div class="row"><b>#${code(o)}</b><span class="badge" style="background:${c}">${t}</span></div>
  ${admin ? `<div>${esc(o.name)} ${o.username ? "@" + esc(o.username) : ""} · ${esc(o.phone)}</div>` : ""}
  <div class="mute">${linesText(o)}</div>
  <div class="mute">${o.mode === "delivery" ? "Delivery to " + esc(o.address || "") : "Pick up"}${o.note ? " · Note: " + esc(o.note) : ""}</div>
  <div class="row"><b>${money(o.total)}</b>${!admin && o.status === "awaiting_payment" ? `<button class="sm on" data-a="paynow" data-v="${o.id}">Pay now</button>` : ""}</div>${btns}</div>`;
}
const ordersView = () => `<h2>My orders</h2>${S.orders.map(o => orderCard(o)).join("") || '<p class="mute">No orders yet.</p>'}`;
function chatView() {
  return `<h2>${S.with ? "Chat with " + esc(S.wname) : "Message the shop"}</h2>${S.with ? '<button class="sm" data-a="admin" data-v="">← Back</button>' : ""}
  <div>${S.thread.map(m => `<div class="bub ${m.mine ? "me" : ""}">${esc(m.text)}<small>${new Date(m.at).toLocaleString()}</small></div>`).join("") || '<p class="mute">Ask about your order or the menu. The shop will reply here.</p>'}</div>
  <input id="msg" class="in" placeholder="Type a message…" aria-label="Message"><button class="btn" data-a="send">Send</button>`;
}
function meView() {
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {}, p = S.prof;
  return `<h2>Profile</h2><div class="box"><b>${esc(p.name || [u.first_name, u.last_name].filter(Boolean).join(" ") || "Guest")}</b><div class="mute">${u.username ? "@" + esc(u.username) : "Telegram customer"}</div></div>
  <input class="in" data-p="phone" placeholder="Phone number" inputmode="tel" value="${esc(p.phone || "")}" aria-label="Phone number">
  <textarea class="in" data-p="address" rows="2" placeholder="Default delivery address" aria-label="Address">${esc(p.address || "")}</textarea>
  <button class="btn" data-a="saveprof">Save profile</button>`;
}
function adminView() {
  if (S.with) return chatView();
  const tabs = `<div class="opts"><button class="sm ${S.aTab === "orders" ? "on" : ""}" data-a="atab" data-v="orders">Orders</button><button class="sm ${S.aTab === "chats" ? "on" : ""}" data-a="atab" data-v="chats">Customer messages</button></div>`;
  return `<h2>Shop admin</h2>${tabs}` + (S.aTab === "orders" ? S.aOrders.map(o => orderCard(o, true)).join("") || '<p class="mute">No orders yet.</p>'
    : S.threads.map(t => `<button class="box row" style="width:100%;text-align:left" data-a="chatwith" data-v="${t.uid}|${esc(t.name)}"><span><b>${esc(t.name)}</b><br><span class="mute">${esc(t.text)}</span></span></button>`).join("") || '<p class="mute">No messages yet.</p>');
}
function sheetView() {
  const it = S.item, m = find(it.id); if (!m) return "";
  const price = (m.price + (m.drink ? M.sizes[it.size][1] : 0)) * it.qty;
  return `<div class="sh"><div class="ph">${pic(m)}</div><div class="row"><h2 style="margin:8px 0">${esc(m.name)}</h2><b>${money(m.price)}</b></div><p class="mute">${esc(m.d || "")}</p>
  ${m.drink ? `<b>Cup size</b><div class="opts">${M.sizes.map((s, i) => `<button class="sm ${it.size === i ? "on" : ""}" data-a="size" data-v="${i}">${s[0]}${s[1] ? " +" + money(s[1]) : ""}</button>`).join("")}</div>
  <b>Sugar level</b><div class="opts">${M.sugars.map((s, i) => `<button class="sm ${it.sugar === i ? "on" : ""}" data-a="sugar" data-v="${i}">${s}</button>`).join("")}</div>` : ""}
  <div class="row"><b>Quantity</b><span><button class="sm" data-a="iq" data-v="-1" aria-label="Less">−</button> ${it.qty} <button class="sm" data-a="iq" data-v="1" aria-label="More">+</button></span></div>
  <button class="btn" data-a="add">Add to Cart • ${money(price)}</button><button class="btn ghost" data-a="close">Close</button></div>`;
}
function nav() {
  const n = S.cart.reduce((a, l) => a + l.qty, 0), t = [["menu", "☕", "Menu"], ["cart", "🛒", "Cart"], ["orders", "🧾", "Orders"], ["chat", "💬", "Chat"], ["me", "👤", "Profile"]];
  if (M.admin) t.push(["admin", "🛠", "Admin"]);
  $("nav").innerHTML = t.map(([k, i, l]) => `<button class="tab ${S.tab === k || (S.tab === "pay" && k === "orders") ? "on" : ""}" data-a="tab" data-v="${k}"><b>${i}</b>${l}${k === "cart" && n ? `<span class="dot">${n}</span>` : ""}</button>`).join("");
}
function render() {
  const f = document.activeElement && document.activeElement.id === "q";
  $("v").innerHTML = { menu: menuView, cart: cartView, pay: payView, orders: ordersView, chat: chatView, me: meView, admin: adminView }[S.tab]();
  nav(); if (f) { const q = $("q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function sheet() { $("sheet").innerHTML = S.item ? sheetView() : ""; $("sheet").hidden = !S.item; }

// ---- data ----
async function loadOrders() { try { S.orders = (await api("orders")).orders; if (S.tab === "orders") render(); } catch {} }
async function loadThread() { try { const r = await api("msg_thread", { with: S.with }); S.thread = r.messages; if (S.tab === "chat" || (S.tab === "admin" && S.with)) render(); } catch {} }
async function loadAdmin() { try { S.aOrders = (await api("admin_orders")).orders; S.threads = (await api("msg_threads")).threads; if (S.tab === "admin") render(); } catch {} }
async function place() {
  const f = S.form;
  if (!f.phone.trim()) return toast("Please add your phone number");
  if (S.mode === "delivery" && !f.address.trim()) return toast("Please add your delivery address");
  try {
    const r = await api("order_create", { items: S.cart.map(l => ({ id: l.id, size: l.size, sugar: l.sugar, qty: l.qty })), mode: S.mode, phone: f.phone, address: f.address, note: f.note });
    S.cart = []; S.pay = r.order; go("pay");
  } catch { toast("Couldn't place the order. Please try again."); }
}

// ---- events ----
$("app").addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if (!t) return; const a = t.dataset.a, v = t.dataset.v;
  if (a === "tab") go(v);
  else if (a === "cat") { S.cat = v; render(); }
  else if (a === "open") { S.item = { id: v, size: 0, sugar: 2, qty: 1 }; sheet(); }
  else if (a === "size" || a === "sugar") { S.item[a] = +v; sheet(); }
  else if (a === "iq") { S.item.qty = Math.max(1, S.item.qty + +v); sheet(); }
  else if (a === "close") { S.item = null; sheet(); }
  else if (a === "add") {
    const x = S.item, same = S.cart.find(l => l.id === x.id && l.size === x.size && l.sugar === x.sugar);
    if (same) same.qty += x.qty; else S.cart.push({ ...x });
    S.item = null; sheet(); render(); toast(find(x.id).name + " added to cart");
  }
  else if (a === "qty") { const [i, d] = v.split(":"); S.cart[+i].qty = Math.max(1, S.cart[+i].qty + +d); render(); }
  else if (a === "rm") { S.cart.splice(+v, 1); render(); }
  else if (a === "mode") { S.mode = v; render(); }
  else if (a === "place") place();
  else if (a === "copy") { try { await navigator.clipboard.writeText(v); toast("Account number copied"); } catch { toast(v); } }
  else if (a === "paid") { try { await api("order_pay", { id: S.pay.id }); toast("Thank you! We'll check your payment."); S.pay = null; go("orders"); } catch { toast("Couldn't send. Try again."); } }
  else if (a === "paynow") { S.pay = S.orders.find(o => o.id === v); go("pay"); }
  else if (a === "send") { const i = $("msg"), text = i.value.trim(); if (!text) return; i.value = ""; try { await api("msg_send", { text, to: S.with, name: S.wname }); loadThread(); } catch { toast("Couldn't send. Try again."); } }
  else if (a === "saveprof") { try { await api("profile_set", S.prof); toast("Profile saved"); } catch { toast("Couldn't save. Try again."); } }
  else if (a === "atab") { S.aTab = v; render(); }
  else if (a === "st") { const [id, status] = v.split("|"); try { await api("order_status", { id, status }); loadAdmin(); toast("Order updated"); } catch { toast("Couldn't update. Try again."); } }
  else if (a === "chatwith") { const [u, n] = v.split("|"); S.with = u; S.wname = n; S.thread = []; S.tab = "admin"; render(); loadThread(); }
  else if (a === "admin") { S.with = null; loadAdmin(); render(); }
});
$("app").addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; render(); }
  else if (t.dataset.f) S.form[t.dataset.f] = t.value;
  else if (t.dataset.p) { S.prof[t.dataset.p] = t.value; if (t.dataset.p === "phone" && !S.form.phone) S.form.phone = t.value; }
});
setInterval(() => { if (document.hidden || !live()) return; if (S.tab === "orders") loadOrders(); else if (S.tab === "chat" || (S.tab === "admin" && S.with)) loadThread(); }, 15000);

async function start() {
  if (!live() && !PREVIEW) {
    $("app").innerHTML = `<div class="out"><div><h2>Open in Telegram ☕</h2><p class="mute" style="margin-bottom:16px">Please order from inside Telegram.</p>${TELEGRAM_LINK ? `<a class="btn" style="display:block;text-decoration:none" href="${esc(TELEGRAM_LINK)}">Open in Telegram</a>` : ""}</div></div>`;
    return;
  }
  try {
    M = await api("menu"); S.prof = (await api("profile")).profile || {};
    S.form.phone = S.prof.phone || ""; S.form.address = S.prof.address || "";
    render();
  } catch { $("v").innerHTML = '<p class="mute" style="padding:30px">Couldn\'t load the menu. Close and reopen the app to try again.</p>'; }
}
start();
</script>
</body>
</html>
