<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiri Coffee and Food</title>
<link rel="icon" href="/kiri-logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--sat:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));--bg:#F3ECE2;--card:#FBF7F1;--ink:#4A2913;--brand:#6B3A1F;--mid:#A87752;--mute:#7d6a5b;--line:#e6dccf;--on:#fff;--glass:rgba(255,255,255,.5);--edge:rgba(255,255,255,.75);--b1:#f2b880;--b2:#ffd9c2;--b3:#c9a27c;
box-sizing:border-box;padding-top:var(--sat)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1611;--card:#2a1f18;--ink:#f1e4d6;--brand:#c98d5c;--mid:#7a4f31;--mute:#b5a191;--line:#3d2f25;--on:#1d1611;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.2);--b1:#7a3f1a;--b2:#3d2a52;--b3:#5a3a2a}}
:root[data-theme="dark"]{--bg:#1d1611;--card:#2a1f18;--ink:#f1e4d6;--brand:#c98d5c;--mid:#7a4f31;--mute:#b5a191;--line:#3d2f25;--on:#1d1611;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.2);--b1:#7a3f1a;--b2:#3d2a52;--b3:#5a3a2a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100%;background:var(--card);position:relative;overflow:hidden;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
h2{font:700 22px Georgia,serif;color:var(--brand);margin:6px 0 12px}
.brand{font:700 26px Georgia,serif;color:var(--brand)}.hd small{margin-left:8px;color:var(--mute)}
.mute{color:var(--mute)}
.in{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.chip.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--bg);border-radius:16px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ph{height:110px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:44px;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.card b{font-size:14px;margin-top:4px}.card span{color:var(--mute);font-size:13px}
.btn{width:100%;background:var(--brand);color:var(--on);border-radius:999px;padding:14px;font-weight:600;margin-top:10px}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.sm{padding:6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.sm.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.box{background:var(--bg);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.badge{font-size:11px;color:#fff;padding:3px 9px;border-radius:999px}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;font-size:10.5px;color:var(--mute);position:relative}.tab b{display:block;font-size:19px;font-weight:400}.tab.on{color:var(--brand);font-weight:700}
.dot{position:absolute;top:-2px;left:56%;background:var(--brand);color:var(--on);border-radius:9px;font-size:10px;padding:0 5px}
#sheet{position:absolute;inset:0;background:var(--bg);display:flex;align-items:stretch;z-index:20}
#sheet[hidden],#toast[hidden]{display:none}
.sh{width:100%;max-height:88%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh .ph{height:170px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;margin:6px 0;background:var(--bg)}
.bub.me{margin-left:auto;background:var(--brand);color:var(--on)}
.bub small{display:block;opacity:.7;font-size:10px}
#toast{position:absolute;left:16px;right:16px;top:calc(12px + var(--sat));background:var(--brand);color:var(--on);padding:11px;border-radius:12px;text-align:center;z-index:40}
.qr{width:100%;max-width:300px;height:auto;object-fit:contain;display:block;margin:10px auto;background:#fff;border-radius:12px}
.out{display:grid;place-items:center;height:100%;text-align:center;padding:30px}
/* Liquid glass */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.85;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--b1);top:-18vmax;left:-18vmax}
.bg i:nth-child(2){background:var(--b2);top:25%;right:-24vmax;animation-delay:-8s}
.bg i:nth-child(3){background:var(--b3);bottom:-22vmax;left:5%;animation-delay:-16s}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18)}}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}
#app{background:transparent}
.card,.box,.chip,.sm,.in,.bub,#nav,.sh{-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.card,.box,.chip,.sm,.in,.bub{background:var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge)}
#nav{background:var(--glass);border-top:1px solid var(--edge)}
.sh{background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--edge)}
.chip.on,.sm.on{background:var(--brand);border-color:transparent;color:var(--on);box-shadow:inset 0 1px 0 #fff5,0 4px 14px #0003}
.btn{background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 80%,#fff),var(--brand));box-shadow:inset 0 1px 0 #fff6,0 8px 22px #0003}
.btn.ghost{background:var(--glass);box-shadow:none;border:1px solid var(--edge);color:var(--brand)}
.bub.me{background:var(--brand);border-color:transparent;color:var(--on)}
.ph{background:rgba(255,255,255,.35)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lg{flex:none;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.72);border:1px solid var(--edge);box-shadow:0 6px 18px #0002}
.lg img{width:60px;height:auto;display:block}
.hi{font:700 22px Georgia,serif;color:var(--brand)}
/* Layout from the design mockup */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lg.mini{width:62px;height:62px;border-radius:18px}.lg.mini img{width:48px}
.lg.big{width:170px;height:170px;border-radius:44px}.lg.big img{width:136px}
.bell{display:grid;place-items:center;text-decoration:none;color:inherit;width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);font-size:18px}
.gm{font:700 26px Georgia,serif;color:var(--brand);margin:6px 0 4px}
.srch{text-align:left;color:var(--mute);border-radius:999px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 18px;padding:18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#b98459,#8a5a38);box-shadow:inset 0 1px 0 #fff5,0 10px 26px #0003}
.banner small{opacity:.85}.banner h3{font:700 22px Georgia,serif;margin:2px 0 12px}
.pill{background:#fff;color:var(--brand);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.cup{font-size:64px;line-height:1;filter:drop-shadow(0 6px 10px #0004)}
.sec{font-size:16px}.link{font-size:13px;color:var(--brand)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}
.cat{text-align:center;font-size:12px;color:var(--mute)}
.cat span{display:grid;place-items:center;height:62px;border-radius:18px;font-size:26px;margin-bottom:5px;background:var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge)}
.card.off,.pc.off{opacity:.5}
.hs{display:flex;gap:12px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:none}
.pc{flex:none;width:158px;padding:8px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.pcm{display:block;width:100%;text-align:left}.pcm .ph{height:92px}.pcm b{display:block;font-size:14px;margin:6px 0 2px}
.plus{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on);font-size:18px;line-height:30px}
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:40px 6px 8px}
.pg{display:flex;flex-direction:column;width:100%;height:100%}
.hero{position:relative;flex:none}
.hero .ph{height:290px;border-radius:0 0 30px 30px;font-size:96px}
.rb{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);font-size:20px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pbody{flex:1;overflow-y:auto;padding:16px 18px}
.pr{font:700 20px Georgia,serif;color:var(--brand)}
.feat{display:flex;justify-content:space-around;text-align:center;margin:8px 0 14px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:20px}
.feat small{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.foot{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.composer{position:sticky;bottom:64px;display:flex;gap:8px;align-items:center;padding:8px 0}
.composer .in{margin:0;flex:1}.composer .btn{width:auto;margin:0;padding:12px 20px}
.bub.pend{opacity:.6}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app"><main id="v"><p class="mute" style="padding:30px">Loading the menu…</p></main><nav id="nav"></nav><div id="sheet" hidden></div><div id="toast" hidden></div></div>
<script>
const LOGO = "/kiri-logo.png"; // your Kiri logo
const SHOP_PHONE = "+85581441888", SHOP_PHONE_TEXT = "(+855) 81-441-888"; // Contact Kiri
const PREVIEW = false; // true only for the design preview in chat. Leave false on your real site.
const TELEGRAM_LINK = ""; // your shop's link, like https://t.me/YOUR_BOT/APP_NAME
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { if (tg.isFullscreen && tg.exitFullscreen) tg.exitFullscreen(); } catch {} }
// Telegram's login data normally comes from its script. If that script is blocked, read it from the address instead.
const hashParam = k => { try { return new URLSearchParams(location.hash.slice(1)).get(k) || ""; } catch { return ""; } };
const initData = () => (tg && tg.initData) || hashParam("tgWebAppData");
const live = () => !!initData();
const tgUser = () => { try { return (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || JSON.parse(new URLSearchParams(initData()).get("user")) || {}; } catch { return {}; } };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => "$" + Number(n).toFixed(2);
const code = o => o.id.split("-")[0].toUpperCase();
const STAT = { awaiting_payment: ["Awaiting payment", "#b7791f"], paid_claimed: ["Checking payment", "#2b6cb0"], confirmed: ["Confirmed", "#2f855a"], preparing: ["Preparing", "#2f855a"], ready: ["Ready for pickup", "#2f855a"], on_the_way: ["On the way", "#2f855a"], done: ["Completed", "#718096"], cancelled: ["Cancelled", "#c53030"] };
let M = { cats: [], items: [], sizes: [], sugars: [], fee: 0, bank: {} };
let S = { thread: [], tAfter: 0, unread: 0, banks: [], bankPick: null, qrs: {}, tab: "home", splash: false, cat: "", q: "", cart: [], mode: "pickup", form: { phone: "", address: "", note: "" }, prof: {}, orders: [], oTab: "pending", pay: null, item: null };

let _r = Date.now(); try { const v = localStorage.getItem("kiriRead"); if (v) _r = +v; else localStorage.setItem("kiriRead", _r); } catch {}
S.readAt = _r; // messages from the shop older than this count as read

// ---- server calls (a tiny in-memory stand-in is used for the chat preview) ----
async function api(a, b) {
  if (!live()) return mock(a, b || {});
  const c = new AbortController(), to = setTimeout(() => c.abort(), 20000); let r;
  try { r = await fetch("/api/shop?action=" + a, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "tma " + initData() }, body: JSON.stringify(b || {}), signal: c.signal }); }
  catch (e) { throw new Error(e.name === "AbortError" ? "timeout" : "network"); } finally { clearTimeout(to); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); const e = new Error(j.error || r.status); e.status = r.status; e.detail = j.detail; e.reason = j.reason; throw e; }
  return r.json();
}
const D = { orders: [], msgs: [] };
async function mock(a, b) {
  const it = (id, name, cat, price, e, drink) => ({ id, name, cat, price, img: id, e, drink, d: "Freshly made for you." });
  if (a === "menu") return { cats: ["Coffee", "Matcha", "Food"], items: [it("latte", "Caffè Latte", "Coffee", 4.75, "☕", 1), it("cappuccino", "Cappuccino", "Coffee", 4.5, "☕", 1), it("matcha-latte", "Matcha Latte", "Matcha", 5.5, "🍵", 1), it("avocado-toast", "Avocado Toast", "Food", 8.5, "🥑", 0)], sizes: [["Small", 0], ["Medium", .5], ["Large", 1]], sugars: ["0%", "25%", "50%", "75%", "100%"], fee: 1.5, bank: { name: "ABA Bank", account: "000 729 100", holder: "Kiri Coffee by D.TEP", link: "https://link.payway.com.kh/ABAPAYhT530450X" } };
  if (a === "profile") return { profile: { name: "Sample Customer" } };
  if (a === "profile_set") return { ok: 1 };
  if (a === "order_create") { const m = (await mock("menu")).items; let t = 0; b.items.forEach(i => { const x = m.find(y => y.id === i.id); t += (x.price + (x.drink ? [0, .5, 1][i.size] : 0)) * i.qty; }); const o = { id: Date.now().toString(36) + "-1", items: b.items.map(i => ({ ...i, name: m.find(y => y.id === i.id).name, size: m.find(y => y.id === i.id).drink ? ["Small", "Medium", "Large"][i.size] : null, sugar: m.find(y => y.id === i.id).drink ? ["0%", "25%", "50%", "75%", "100%"][i.sugar] : null })), total: t + (b.mode === "delivery" ? 1.5 : 0), mode: b.mode, address: b.address, loc: b.loc, status: "awaiting_payment", at: Date.now() }; D.orders.unshift(o); return { order: o }; }
  if (a === "orders") return { orders: D.orders };
  if (a === "order_pay") { D.orders.forEach(o => { if (o.id === b.id) { o.status = "paid_claimed"; const k = (D.banks || []).find(x => x.id === b.bank); if (k) o.bank = k.name; } }); return { ok: 1 }; }
  if (a === "msg_send") { const at = Date.now(); D.msgs.push({ text: b.text, at, mine: true, cid: b.cid }); setTimeout(() => D.msgs.push({ text: "Thanks! We'll get back to you soon. ☕", at: Date.now(), mine: false, cid: "" }), 1500); return { ok: 1 }; }
  if (a === "msg_thread") return { messages: D.msgs.filter(m => m.at > (b.after || 0)) };
  if (a === "order_cancel") { D.orders.forEach(o => { if (o.id === b.id && o.status === "awaiting_payment") o.status = "cancelled"; }); return { ok: 1 }; }
  if (a === "order_remove") { D.orders = D.orders.filter(o => o.id !== b.id); return { ok: 1 }; }
  D.banks = D.banks || [{ id: "aba", name: "ABA Bank", account: "000 729 100", holder: "Kiri Coffee by D.TEP", link: "https://link.payway.com.kh/ABAPAYhT530450X", on: true, qrUrl: D.qr || "" }, { id: "acleda", name: "ACLEDA Bank (sample)", account: "0012 3456 7890", holder: "Kiri Coffee", link: "", on: true, qrUrl: "" }, { id: "wing", name: "Wing (sample)", account: "012 345 678", holder: "Kiri Coffee", link: "", on: true, qrUrl: "" }, { id: "bakong", name: "Bakong (sample)", account: "kiri@bkrt", holder: "Kiri Coffee", link: "", on: true, qrUrl: "" }];
  if (a === "banks") return { banks: D.banks.filter(x => x.on !== false) };
  if (a === "bank_qr") return { qr: "" };
  return {};
}

// ---- helpers ----
const find = id => M.items.find(x => x.id === id);
const linePrice = l => { const m = find(l.id); return (m.price + (m.drink ? M.sizes[l.size][1] : 0)) * l.qty; };
const sub = () => S.cart.reduce((a, l) => a + linePrice(l), 0);
const fee = () => S.mode === "delivery" ? M.fee : 0;
const pic = m => `<img src="/menu/${m.img}.png" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${m.e}\uFE0F'))">`;
let tt; const toast = m => { const e = $("toast"); e.textContent = m; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 2600); };
const linesText = o => o.items.map(i => `${i.qty}× ${esc(i.name)}${i.size ? ` (${esc(i.size)}, sugar ${esc(i.sugar)})` : ""}`).join(", ");
const ask = msg => new Promise(res => (tg && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2") && tg.showConfirm) ? tg.showConfirm(msg, res) : res(confirm(msg)));
const mapLink = l => `https://www.google.com/maps?q=${l.lat},${l.lng}`;
function getPos() { // one fresh GPS reading, through Telegram when it can, otherwise the phone's own location
  if (!live()) return Promise.resolve({ lat: 11.5564, lng: 104.9282, acc: 15 }); // chat preview only
  return new Promise((res, rej) => {
    const web = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), () => rej(new Error("denied")), { enableHighAccuracy: true, timeout: 15000 }) : rej(new Error("unsupported"));
    const lm = tg && tg.LocationManager;
    if (!lm) return web();
    const get = () => lm.getLocation(l => l ? res({ lat: l.latitude, lng: l.longitude, acc: l.horizontal_accuracy || 0 }) : web());
    try { lm.isInited ? get() : lm.init(get); } catch { web(); }
  });
}
const go = t => {
  S.tab = t;
  if (t === "pay") S.bankPick = null;
  render(); if (t === "orders") loadOrders(); if (t === "chat") { S.thread = []; S.tAfter = 0; loadThread(); }
};
// Telegram shows its own "Close" control at the top; this wires up the native "<" back control to sit alongside it.
function updateBackButton() {
  if (!tg || !tg.BackButton) return;
  try { (!S.splash && (S.item || S.tab !== "home")) ? tg.BackButton.show() : tg.BackButton.hide(); } catch {}
}
function goBack() {
  if (S.item) { S.item = null; return sheet(); }
  if (S.tab === "pay" && S.bankPick) { S.bankPick = null; return render(); }
  if (S.tab === "pay") return go("orders");
  if (S.tab === "chat") return go("me");
  if (S.tab !== "home") return go("home");
}
if (tg && tg.BackButton) { try { tg.BackButton.onClick(goBack); } catch {} }

// ---- screens ----
const ICON = { Coffee: "☕", Matcha: "🍵", "Tea & More": "🫖", Food: "🍴" };
const POPULAR = ["latte", "cappuccino", "strawberry-matcha", "breakfast-sandwich"];
function splashView() {
  return `<div class="splash"><span class="lg big"><img src="${LOGO}" alt="Kiri coffee and food"></span>
  <div><h2 class="gm" style="font-size:30px">Good Coffee<br>Better Moments</h2><p class="mute">Great coffee, fresh food,<br>&amp; a cozy place for you.</p></div>
  <button class="btn" data-a="getstarted">Get Started →</button></div>`;
}
function homeView() {
  const h = new Date().getHours(), hi = h < 12 ? "Good Morning ☀️" : h < 18 ? "Good Afternoon 🌤️" : "Good Evening 🌙";
  let pop = POPULAR.map(find).filter(Boolean); if (pop.length < 3) pop = M.items.slice(0, 4);
  return `<div class="top"><span class="lg mini"><img src="${LOGO}" alt="Kiri coffee and food"></span><span style="display:flex;gap:8px"><a class="bell" href="tel:${SHOP_PHONE}" aria-label="Call Kiri">📞</a><button class="bell" data-a="tab" data-v="orders" aria-label="Order updates">🔔</button></span></div>
  <h2 class="gm">${hi}</h2><p class="mute" style="margin-bottom:12px">Enjoy your favorite coffee<br>and fresh food today.</p>
  <button class="in srch" data-a="search">🔍&nbsp; Search menu…</button>

function mergeMsgs(list) { // new messages replace the "Sending…" copies, and nothing is shown twice
  for (const m of list) {
    const i = S.thread.findIndex(x => (m.cid && x.cid === m.cid) || (x.at === m.at && x.text === m.text));
    if (i >= 0) S.thread[i] = m; else S.thread.push(m);
    S.tAfter = Math.max(S.tAfter, m.at);
  }
  S.thread.sort((a, b) => a.at - b.at);
}
function paintThread() {
  const th = $("th"); if (!th) return;
  const box = $("v"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  th.innerHTML = threadHtml(); if (stick) box.scrollTop = box.scrollHeight;
}
function markRead() { S.readAt = Math.max(S.readAt, S.tAfter); try { localStorage.setItem("kiriRead", S.readAt); } catch {} if (S.unread) { S.unread = 0; nav(); } }
async function sendMsg() {
  const i = $("msg"), text = i.value.trim(); if (!text) return; i.value = "";
  const cid = Math.random().toString(36).slice(2, 10);
  S.thread.push({ text, at: Date.now(), mine: true, cid, pending: true }); paintThread();
  try { await api("msg_send", { text, cid }); loadThread(); }
  catch { S.thread = S.thread.filter(m => m.cid !== cid); paintThread(); i.value = text; toast("Couldn't send. Try again."); }
}
async function checkUnread() { // a quiet check while the customer is on another screen
  try {

}

// ---- data ----
async function loadOrders() { try { S.orders = (await api("orders")).orders; if (S.tab === "orders") render(); } catch {} }

  try { mergeMsgs((await api("msg_thread", { after: S.tAfter })).messages); if (S.tab === "chat") { paintThread(); markRead(); } } catch {}
}
async function loadBanks() { // the banks the shop accepts
  try { S.banks = (await api("banks")).banks; } catch {}
  if (S.tab === "pay") render();
}
async function loadQr(id) { // bank QR pictures are fetched only when a customer picks that bank
  const b = S.banks.find(x => x.id === id);
  if (!b || b.qrUrl || S.qrs[id] !== undefined) return;
  S.qrs[id] = b.hasQr ? ((await api("bank_qr", { id }).catch(() => ({}))).qr || "") : "";
  if (S.tab === "pay") render();
}
async function place() {
  const f = S.form;
  if (!f.phone.trim()) return toast("Please add your phone number");
  const withLoc = S.mode === "delivery" && S.prof.loc && f.useLoc !== false;
  if (S.mode === "delivery" && !f.address.trim() && !withLoc) return toast("Please add your delivery address or share your location");
  try {
    const r = await api("order_create", { items: S.cart.map(l => ({ id: l.id, size: l.size, sugar: l.sugar, qty: l.qty })), mode: S.mode, phone: f.phone, address: f.address, note: f.note, loc: withLoc ? S.prof.loc : undefined, locNote: withLoc ? S.prof.locNote : undefined });
    S.cart = []; S.pay = r.order; go("pay");
  } catch (e) { toast(String(e.message).startsWith("sold out") ? "Sorry, " + e.message : "Couldn't place the order. Please try again."); }
}

// ---- events ----
// Banking apps only open from the phone's real browser. Telegram's built-in browser (the default on Android) can't hand a link to the ABA app.
function openExternal(url) {
  try {
    if (tg && tg.openLink) tg.openLink(url, /android/i.test((tg.platform || "") + navigator.userAgent) ? { try_browser: "chrome" } : undefined);
    else window.open(url, "_blank");
  } catch { window.open(url, "_blank"); }
}
$("app").addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if (!t) return; const a = t.dataset.a, v = t.dataset.v;
  if (a === "tab") go(v);
  else if (a === "getstarted") { S.splash = false; try { localStorage.setItem("kiriSeen", "1"); } catch {} render(); }
  else if (a === "search") { S.tab = "menu"; render(); const q = $("q"); if (q) q.focus(); }
  else if (a === "homecat") { S.cat = v; go("menu"); }
  else if (a === "quick") { if (find(v).off) return toast(find(v).name + " is sold out right now"); const x = { id: v, size: 0, sugar: 2, qty: 1 }, same = S.cart.find(l => l.id === v && l.size === 0 && l.sugar === 2); if (same) same.qty++; else S.cart.push(x); nav(); toast(find(v).name + " added to cart"); }
  else if (a === "cat") { S.cat = v; render(); }
  else if (a === "open") { if (find(v).off) return toast(find(v).name + " is sold out right now"); S.item = { id: v, size: 0, sugar: 2, qty: 1 }; sheet(); }
  else if (a === "size" || a === "sugar") { S.item[a] = +v; sheet(); }
  else if (a === "iq") { S.item.qty = Math.max(1, S.item.qty + +v); sheet(); }
  else if (a === "close") { S.item = null; sheet(); }
  else if (a === "add") {
    const x = S.item, same = S.cart.find(l => l.id === x.id && l.size === x.size && l.sugar === x.sugar);
    if (same) same.qty += x.qty; else S.cart.push({ ...x });
    S.item = null; sheet(); render(); toast(find(x.id).name + " added to cart");
  }
  else if (a === "qty") { const [i, d] = v.split(":"); S.cart[+i].qty = Math.max(1, S.cart[+i].qty + +d); render(); }
  else if (a === "rm") { S.cart.splice(+v, 1); render(); }
  else if (a === "mode") { S.mode = v; render(); }
  else if (a === "place") place();
  else if (a === "copy") { try { await navigator.clipboard.writeText(v); toast("Copied"); } catch { toast(v); } }
  else if (a === "abalink") openExternal(v);
  else if (a === "bank") { // "Pay now" on a bank
    const bk = S.banks.find(x => x.id === v); S.bankPick = v; render(); loadQr(v);
    if (bk && bk.link) openExternal(bk.link); // open first, while it still counts as the customer's tap
    try { await api("order_pay", { id: S.pay.id, bank: v }); } catch { toast("Couldn't tell the shop about your payment. Please try again."); }
  }
  else if (a === "bankchange") { S.bankPick = null; render(); }
  else if (a === "getloc") {
    toast("Finding your location…");
    try { S.prof.loc = { ...(await getPos()), at: Date.now() }; await api("profile_set", S.prof); render(); toast("Location saved"); }
    catch (e) { toast(e.message === "unsupported" ? "This phone can't share location here." : "Couldn't get your location. Allow location for Telegram in your phone settings, then try again."); }
  }
  else if (a === "openmap") openExternal(mapLink(S.prof.loc));
  else if (a === "clearloc") { const old = S.prof.loc; try { await api("profile_set", { ...S.prof, loc: null }); delete S.prof.loc; render(); toast("Location removed"); } catch { S.prof.loc = old; toast("Couldn't remove it. Try again."); } }
  else if (a === "ocancel") {
    if (!await ask("Cancel this order? You haven't paid yet, so nothing is charged.")) return;
    try { await api("order_cancel", { id: v }); toast("Order cancelled"); } catch (e) { toast(e.message === "already_paid" ? "You already started paying. Please message the shop." : "Couldn't cancel. Try again."); }
    loadOrders();
  }
  else if (a === "oremove") { try { await api("order_remove", { id: v }); loadOrders(); } catch { toast("Couldn't remove it. Try again."); } }
  else if (a === "paynow") { S.pay = S.orders.find(o => o.id === v); go("pay"); }
  else if (a === "send") sendMsg();
  else if (a === "saveprof") { try { await api("profile_set", S.prof); toast("Profile saved"); } catch { toast("Couldn't save. Try again."); } }
  else if (a === "otab") { S.oTab = v; render(); }
});

let tick = 0; // near real time: check for new messages every 2.5 seconds while the chat is open
setInterval(() => { if (document.hidden || (!live() && !PREVIEW)) return; tick++; if (S.tab === "chat") loadThread(); else if (tick % 6 === 0) { checkUnread(); if (S.tab === "orders") loadOrders(); } }, 2500);
$("app").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && e.target.id === "msg") { e.preventDefault(); sendMsg(); } });

async function start() {
  if (!live() && !PREVIEW) {
    $("app").innerHTML = `<div class="out"><div><span class="lg" style="width:104px;height:104px;margin:0 auto 14px"><img src="${LOGO}" alt="Kiri coffee and food" style="width:82px"></span><h2>Open in Telegram ☕</h2><p class="mute" style="margin-bottom:16px">Please order from inside Telegram.</p>${TELEGRAM_LINK ? `<a class="btn" style="display:block;text-decoration:none" href="${esc(TELEGRAM_LINK)}">Open in Telegram</a>` : ""}
      <p class="mute" style="font-size:12px;margin-top:22px">Details: Telegram script ${window.Telegram ? "loaded" : "not loaded"} · login data ${hashParam("tgWebAppData") ? "in address" : "none"} · platform ${esc((tg && tg.platform) || "unknown")}</p></div></div>`;
    return;
  }
  try { M = await api("menu"); } catch (e) { return fail(e); }
  loadBanks();
  try { S.splash = PREVIEW || localStorage.getItem("kiriSeen") !== "1"; } catch { S.splash = true; } // the welcome screen shows on the first visit only
  render(); // show the menu first; the saved profile is a bonus and must never block it
  try {
    S.prof = (await api("profile")).profile || {};
    S.form.phone = S.prof.phone || ""; S.form.address = S.prof.address || "";
    if (S.tab === "me" || S.tab === "cart") render();
  } catch {}
}
const HINT = { no_token: "BOT_TOKEN isn't set for this project in Vercel (Production). Add it, then run npx vercel --prod.",
  bad_signature: "BOT_TOKEN in Vercel doesn't belong to the bot that opened this app. Copy the token of @kiricoffee_food_bot from @BotFather (/token), paste it with no spaces or quotes, then run npx vercel --prod.",
  expired: "Telegram's login data is too old. Fully close the app and open it again from the bot.",
  no_initdata: "Open the shop from its Telegram link, not from a browser.", 404: "The order service (api/shop.js) isn't deployed on this site.", 401: "Telegram login failed. BOT_TOKEN in Vercel must be the token of the bot that opens this app.", 500: "The server hit an error. Check the settings in Vercel.", timeout: "The server took too long to answer.", network: "Couldn't reach the server. Check your connection." };
function fail(e) {
  $("v").innerHTML = `<div style="padding:30px"><h2>Couldn't load the menu</h2><p class="mute">${esc(HINT[e.reason] || HINT[e.status] || HINT[e.message] || e.message)}</p><p class="mute" style="font-size:12px;margin:12px 0">Code: ${esc(e.status || e.message)}${e.reason ? " · " + esc(e.reason) : ""}${e.detail ? " · " + esc(e.detail) : ""}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;
}
// If anything breaks while loading, say so on screen instead of leaving it blank
const stuck = () => $("v") && $("v").textContent.includes("Loading the menu");
addEventListener("error", ev => { if (stuck()) fail({ message: "Script error: " + ev.message }); });
addEventListener("unhandledrejection", ev => { if (stuck()) fail({ message: "Error: " + ((ev.reason && ev.reason.message) || ev.reason) }); });
start();
</script>
</body>
</html>
